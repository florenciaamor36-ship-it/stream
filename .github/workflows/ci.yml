name: Branch CI
on:
  push:
    branches:
      - feature/firebase-web-auth-adapter-2026-11-19
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/feature/firebase-web-auth-adapter-2026-11-19'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build production bundles
        run: npm run build
      - name: Typecheck
        run: npm run lint
      - name: Run Firebase containment and contract checks
        run: python3 tests/security-containment.test.py
      - name: Test shared account/sale mapping round trips
        run: npm run test:contract
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firestore emulator test tools
        run: npm install --no-save --package-lock=false firebase@11.10.0 @firebase/rules-unit-testing@4.0.1 firebase-tools@14.12.1
      - name: Test owner rules against Firestore emulator (synthetic data only)
        run: npx firebase emulators:exec --only firestore --project demo-stream-flow-contract 'node tests/firestore-rules-emulator.test.mjs'
