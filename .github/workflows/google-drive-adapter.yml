name: Google Drive adapter tests
on:
  push:
    branches: [feature/google-drive-appdata]
  pull_request:
    branches: [feature/google-drive-appdata]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run test:drive
