name: Build isolated Worker preview bundle
on:
  workflow_dispatch:
  push:
    branches: ["preview/worker-api-integration"]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle isolated Worker without deploying
        run: npx --yes esbuild@0.25.0 worker/src/index.ts --bundle --platform=browser --format=esm --target=es2022 --outfile=.worker-bundle/index.js
      - uses: actions/upload-artifact@v4
        with:
          name: stream-flow-worker-preview-bundle
          path: .worker-bundle/
          retention-days: 1
